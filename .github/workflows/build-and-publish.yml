name: Build, test, and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Vertical.Slice.Template.sln

      - name: Build
        run: dotnet build Vertical.Slice.Template.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Vertical.Slice.Template.sln --configuration Release --no-build

  calculate-version:
    name: Calculate release version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install nbgv CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94

      - name: Calculate version
        id: version
        shell: bash
        run: |
          NBGV="$RUNNER_TEMP/nbgv/nbgv" bash scripts/calculate-version.sh

  publish:
    name: Publish package and release assets
    if: needs['calculate-version'].outputs.environment != 'none'
    needs:
      - build-test
      - calculate-version
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Set package directory
        run: '"PACKAGE_DIRECTORY=$env:RUNNER_TEMP/nuget" >> $env:GITHUB_ENV'

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ needs['calculate-version'].outputs.version }}
        run: >-
          nuget pack vertical-slice-template.nuspec
          -OutputDirectory "$env:PACKAGE_DIRECTORY"
          -Properties "version=$env:PACKAGE_VERSION"
          -NoDefaultExcludes -NoPackageAnalysis

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ${{ runner.temp }}/nuget/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        continue-on-error: true
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $package = Get-ChildItem "$env:PACKAGE_DIRECTORY/*.nupkg" | Select-Object -First 1 -ExpandProperty FullName
          dotnet nuget push "$package" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish matching Release Drafter draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: file:release-drafter.yml
          version: ${{ needs['calculate-version'].outputs.version }}
          name: v${{ needs['calculate-version'].outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: ${{ contains(needs['calculate-version'].outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}
        run: |
          $packages = Get-ChildItem "$env:PACKAGE_DIRECTORY/*.nupkg" | Select-Object -ExpandProperty FullName
          gh release upload "$env:RELEASE_TAG" $packages --clobber
